<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1320" role="img" aria-labelledby="title desc">
  <title id="title">Flujo QR con TransporteAdapter</title>
  <desc id="desc">Secuencia verificada en qr-server: crear sala, cargar documentos desde el móvil, preparar PDFs, seleccionar el adaptador de Transporte, subir cada archivo y confirmar la carga temporal. Incluye notificaciones, limpieza y errores.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#22d3ee"/></marker>
    <marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#34d399"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#fb923c"/></marker>
    <marker id="return" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: 'Cascadia Code', 'SF Mono', monospace; fill:#e2e8f0; font-size:11px; }
    .name { font-size:12px; font-weight:600; text-anchor:middle; }
    .sub { fill:#94a3b8; font-size:10px; text-anchor:middle; }
    .label { text-anchor:middle; paint-order:stroke; stroke:#0f172a; stroke-width:5px; stroke-linejoin:round; }
    .life { stroke:#334155; stroke-dasharray:6 5; }
    .call { fill:none; stroke:#34d399; stroke-width:1.5; marker-end:url(#green); }
    .input { fill:none; stroke:#22d3ee; stroke-width:1.5; marker-end:url(#cyan); }
    .send { fill:none; stroke:#fb923c; stroke-width:1.5; marker-end:url(#orange); }
    .reply { fill:none; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:6 4; marker-end:url(#return); }
    .phase { font-size:12px; font-weight:600; fill:#60a5fa; }
    .note { fill:#94a3b8; font-size:10px; }
  </style>
  <rect width="1400" height="1320" fill="#0f172a"/>
  <rect width="1400" height="1320" fill="url(#grid)"/>
  <rect x="490" y="92" width="650" height="1028" rx="12" fill="none" stroke="#fbbf24" stroke-dasharray="8 4"/>
  <text x="510" y="110" fill="#fbbf24" font-size="10">QR SERVER · componentes internos</text>
  <g class="life">
    <path d="M130 195V1110"/><path d="M350 195V1110"/><path d="M580 195V1110"/>
    <path d="M800 195V1110"/><path d="M1030 195V1110"/><path d="M1270 195V1110"/>
  </g>
  <rect x="575" y="680" width="10" height="360" fill="#064e3b" stroke="#34d399"/>
  <rect x="795" y="775" width="10" height="235" fill="#78350f" stroke="#fb923c"/>
  <rect x="1025" y="825" width="10" height="155" fill="#78350f" stroke="#fb923c"/>
  <g>
    <rect x="45" y="135" width="170" height="60" rx="7" fill="#0f172a"/><rect x="45" y="135" width="170" height="60" rx="7" fill="#083344" stroke="#22d3ee"/>
    <text class="name" x="130" y="159">Web de Transporte</text><text class="sub" x="130" y="178">Observador / origen</text>
    <rect x="265" y="135" width="170" height="60" rx="7" fill="#0f172a"/><rect x="265" y="135" width="170" height="60" rx="7" fill="#083344" stroke="#22d3ee"/>
    <text class="name" x="350" y="159">App móvil</text><text class="sub" x="350" y="178">Escanea y sube</text>
    <rect x="500" y="135" width="160" height="60" rx="7" fill="#0f172a"/><rect x="500" y="135" width="160" height="60" rx="7" fill="#064e3b" stroke="#34d399"/>
    <text class="name" x="580" y="159">API + GestionSalas</text><text class="sub" x="580" y="178">Orquesta el proceso</text>
    <rect x="710" y="135" width="180" height="60" rx="7" fill="#0f172a"/><rect x="710" y="135" width="180" height="60" rx="7" fill="#431407" stroke="#fb923c"/>
    <text class="name" x="800" y="159">DestinationDispatcher</text><text class="sub" x="800" y="178">Selecciona por sistema</text>
    <rect x="945" y="135" width="170" height="60" rx="7" fill="#0f172a"/><rect x="945" y="135" width="170" height="60" rx="7" fill="#431407" stroke="#fb923c"/>
    <text class="name" x="1030" y="159">TransporteAdapter</text><text class="sub" x="1030" y="178">Contrato HTTP destino</text>
    <rect x="1185" y="135" width="170" height="60" rx="7" fill="#0f172a"/><rect x="1185" y="135" width="170" height="60" rx="7" fill="#1e293b" stroke="#94a3b8"/>
    <text class="name" x="1270" y="159">Backend Transporte</text><text class="sub" x="1270" y="178">Carga temporal gastos</text>
  </g>
  <text class="phase" x="40" y="230">01 · CREAR SALA</text>
  <path class="input" d="M130 275H580"/><text class="label" x="355" y="262">POST /api/v1/salas · X-API-Key</text>
  <rect x="690" y="225" width="420" height="110" rx="7" fill="#0f172a" stroke="#a78bfa"/>
  <text x="710" y="248" fill="#a78bfa">Contexto guardado en MemorySalaRepository</text>
  <text x="710" y="270">sistema: transporte · modulo: gastos</text>
  <text x="710" y="292">recurso_referencia: UUID de carga temporal</text>
  <text x="710" y="314" class="note">recurso_id ausente/null · carga previamente existente</text>
  <path class="reply" d="M580 355H130"/><text class="label" x="355" y="342">QR + código + token observador + URL WebSocket</text>
  <path class="input" d="M130 405H350"/><text class="label" x="240" y="392">Mostrar QR → escanear</text>
  <path class="input" d="M350 455H580"/><text class="label" x="465" y="442">WS con token móvil</text>
  <text class="note" x="690" y="450">El QR contiene sala_id, código y token de invitación.</text>
  <text class="note" x="690" y="470">Web y móvil escuchan eventos de la misma sala.</text>
  <text class="phase" x="40" y="510">02 · RECIBIR DOCUMENTOS</text>
  <path class="input" d="M350 550H580"/><text class="label" x="465" y="537">POST …/documentos</text>
  <rect x="690" y="505" width="420" height="95" rx="7" fill="#0f172a" stroke="#a78bfa"/>
  <text x="710" y="528">Validar token móvil y límites</text>
  <text x="710" y="550">Guardar archivo en TemporaryFileStorage</text>
  <text x="710" y="572">Registrar documento en Sala · estado: recibiendo</text>
  <path class="reply" d="M580 625H130"/><text class="label" x="355" y="612">WebSocket: documento_recibido → clientes conectados</text>
  <text class="phase" x="40" y="665">03 · FINALIZAR Y ENTREGAR</text>
  <path class="input" d="M350 705H575"/><text class="label" x="462" y="692">POST …/finalizar</text>
  <text class="note" x="40" y="728">Puede solicitarlo móvil u observador.</text>
  <rect x="690" y="640" width="420" height="95" rx="7" fill="#0f172a" stroke="#34d399"/>
  <text x="710" y="663">Estado: finalizando + aviso WS «Procesando»</text>
  <text x="710" y="685">Imágenes: se entregan como archivos individuales</text>
  <text x="710" y="707">Páginas tipo pdf: PdfCreator arma 1 PDF por lote</text>
  <path class="call" d="M585 775H795"/><text class="label" x="690" y="762">entregar(sala, archivos)</text>
  <path class="send" d="M805 825H1025"/><text class="label" x="915" y="812">sistema == transporte</text>
  <text class="note" x="710" y="851">Si sistema == kaisvm, elige KaisvmAdapter.</text>
  <rect x="935" y="870" width="435" height="70" rx="5" fill="none" stroke="#64748b" stroke-dasharray="4 3"/>
  <text x="947" y="887" class="note">LOOP · un POST por archivo (envío secuencial)</text>
  <path class="send" d="M1035 918H1270"/><text class="label" x="1152" y="905">multipart: archivo + documentoUuid</text>
  <path class="send" d="M1035 973H1270"/><text class="label" x="1152" y="960">POST …/finalizar (carga temporal)</text>
  <path class="reply" d="M1270 1010H585"/><text class="label" x="927" y="997">Respuesta OK → EntregaResultado (vía adapter y dispatcher)</text>
  <path class="reply" d="M575 1070H130"/><text class="label" x="352" y="1057">WebSocket: completada · «Documentos recibidos por transporte»</text>
  <text class="note" x="690" y="1056">Guardar Sala completada en memoria.</text>
  <text class="note" x="690" y="1078">Eliminar temporales de la sala y devolver resultado HTTP.</text>
  <rect x="40" y="1150" width="650" height="115" rx="8" fill="#0f172a" stroke="#fb923c"/>
  <text x="60" y="1174" fill="#fb923c" font-weight="600">CONTRATO CON TRANSPORTE</text>
  <text x="60" y="1198" font-size="10">Base: {transporte_base_url}/gastos/integraciones/cargas-temporales/{UUID}</text>
  <text x="60" y="1220" class="note">Subidas: /documentos · confirmación: /finalizar · X-KaisQr-Service-Key</text>
  <text x="60" y="1242" class="note">Requiere reenvío activo y service key. UUID documento estable; MIME por firma.</text>
  <rect x="720" y="1150" width="640" height="115" rx="8" fill="#0f172a" stroke="#fb7185"/>
  <text x="740" y="1174" fill="#fb7185" font-weight="600">SI FALLA LA PREPARACIÓN O ENTREGA</text>
  <text x="740" y="1198" class="note">Sala → error; guardar estado y avisar por WebSocket; no limpiar temporales.</text>
  <text x="740" y="1220" class="note">Subidas: hasta 3 intentos solo para ciertos errores de conexión/lectura.</text>
  <text x="740" y="1242" class="note">Sin rollback: algunos archivos pueden haberse recibido. Confirmación sin retry.</text>
  <text x="40" y="1290" class="note">→ llamada / envío     ⇢ respuesta o evento WS · Tiempo: de arriba hacia abajo · No se crea el gasto definitivo en qr-server.</text>
  <text x="30" y="40" font-size="20" font-weight="700">Del QR a Transporte: documentos → carga temporal confirmada</text>
  <text x="30" y="66" class="note">Implementación actual · main.py registra KaisvmAdapter y TransporteAdapter en DestinationDispatcher · rutas con prefijo por defecto /api/v1</text>
</svg>
